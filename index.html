<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X MONEY - Task & Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .header { background: #0088cc; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .balance-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #ddd; font-weight: bold; cursor: pointer; }
        .task-btn { background: #28a745; color: white; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="header">
        <h1>X MONEY</h1>
        <p id="user-name">Loading...</p>
    </div>

    <div class="balance-card">
        <h2>💰 Wallet Balance</h2>
        <h1 id="balance">0.00 Coins</h1>
    </div>

    <div class="btn-grid">
        <button class="btn task-btn" onclick="alert('Task List Opening...')">🔥 Complete Tasks (URL)</button>
        <button class="btn" onclick="alert('Ads Loading...')">📺 Watch Ads</button>
        <button class="btn">👥 Refer & Earn</button>
        <button class="btn">🎁 Daily Bonus</button>
        <button class="btn">💳 Withdraw</button>
        <button class="btn">📜 History</button>
    </div>

    <script>
        // Telegram se user ka data lena
        const tg = window.Telegram.WebApp;
        tg.expand(); // App ko full screen kholne ke liye
        document.getElementById('user-name').innerText = "Hi, " + tg.initDataUnsafe.user.first_name;
    </script>
</body>
</html>
