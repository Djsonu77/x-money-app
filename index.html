<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X MONEY - Earn Free</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; text-align: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { background: #0088cc; color: white; border: none; padding: 12px 20px; border-radius: 8px; margin: 5px; width: 80%; font-weight: bold; cursor: pointer; }
        .points { font-size: 24px; color: green; font-weight: bold; }
        .ad-btn { background: #ff9800; }
        .special-btn { background: #e91e63; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👋 Welcome to X MONEY</h2>
        <p>Wallet Balance</p>
        <div class="points"><span id="balance">0</span> Coins</div>
        <p>50 Coins = ₹1</p>
    </div>

    <div class="card">
        <h3>📺 Watch Ads & Earn</h3>
        <button class="btn ad-btn" onclick="addPoints('random')">Ad Button 1 (Up to 20 pts)</button>
        <button class="btn ad-btn" onclick="addPoints('random')">Ad Button 2 (Up to 20 pts)</button>
        <button class="btn ad-btn" onclick="addPoints('random')">Ad Button 3 (Up to 20 pts)</button>
        <button class="btn ad-btn" onclick="addPoints('random')">Ad Button 4 (Up to 20 pts)</button>
        <hr>
        <button class="btn special-btn" onclick="addPoints('direct')">Direct Link Ad (25 pts)</button>
        <button class="btn" style="background:#4caf50;" onclick="addPoints('short')">URL Shortener (50 pts)</button>
    </div>

    <div class="card">
        <button class="btn" onclick="withdraw()">💰 Withdraw (Min ₹25)</button>
    </div>

    <script>
        let coins = 0;
        const tg = window.Telegram.WebApp;
        tg.expand(); // Full screen mode

        function addPoints(type) {
            let earned = 0;
            if(type === 'random') earned = Math.floor(Math.random() * 20) + 1;
            if(type === 'direct') earned = 25;
            if(type === 'short') earned = 50;

            // Yahan aap apna Monetag Link dal sakte hain
            window.open('YOUR_MONETAG_LINK_HERE', '_blank');

            coins += earned;
            document.getElementById('balance').innerText = coins;
            tg.showAlert(`Badhai ho! Aapne ${earned} coins jeete.`);
        }

        function withdraw() {
            if(coins < 1250) {
                tg.showAlert("Minimum 1250 coins (₹25) chahiye withdraw ke liye!");
            } else {
                tg.showAlert("Withdrawal request sent to Admin!");
            }
        }
    </script>
</body>
</html>
